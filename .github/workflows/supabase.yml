name: Deploy Supabase

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'trilift/supabase/**'
      - '.github/workflows/supabase.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'trilift/package-lock.json'

      - name: Install Supabase CLI
        run: |
          npm install -g supabase

      - name: Link Supabase project
        working-directory: trilift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase projects list --linked | grep -q "trilift" || \
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Set edge function secrets
        working-directory: trilift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Set secrets for remix-session function
          supabase secrets set \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Deploy edge functions
        working-directory: trilift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Deploy remix-session function
          supabase functions deploy remix-session \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

          # Deploy strava-sync function
          supabase functions deploy strava-sync \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

          echo "✓ Edge functions deployed successfully"

      - name: Run migrations
        working-directory: trilift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

          echo "✓ Database migrations applied"

      - name: Verify deployment
        working-directory: trilift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

          echo "✓ Deployment verification complete"
