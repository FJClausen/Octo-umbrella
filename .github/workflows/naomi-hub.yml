name: Naomi Hub

on:
  push:
    paths:
      - 'naomi-hub/**'
      - '.github/workflows/naomi-hub.yml'
  pull_request:
    paths:
      - 'naomi-hub/**'
      - '.github/workflows/naomi-hub.yml'
  workflow_dispatch:

concurrency:
  group: naomi-hub-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: naomi-hub/app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: naomi-hub/app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: Bundle check
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/export"
      - name: API tests
        working-directory: naomi-hub/api
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

  # Push to main (or a manual run on main) builds on EAS and submits to TestFlight.
  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      ASC_APP_ID: ${{ secrets.NAOMI_ASC_APP_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_TEAM_TYPE: ${{ secrets.APPLE_TEAM_TYPE }}
      NAOMI_API_URL: ${{ secrets.NAOMI_API_URL }}
      NAOMI_APP_SECRET: ${{ secrets.NAOMI_APP_SECRET }}
    steps:
      - name: Check EXPO_TOKEN
        id: gate
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::EXPO_TOKEN secret is not set; skipping the EAS build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: naomi-hub/app/package-lock.json

      - uses: expo/expo-github-action@v8
        if: steps.gate.outputs.ready == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Link the EAS project
        if: steps.gate.outputs.ready == 'true'
        run: |
          if [ "$(jq -r '.expo.extra.eas.projectId // empty' app.json)" = "" ]; then
            eas init --non-interactive --force
            echo "::notice::EAS project ID is $(jq -r '.expo.extra.eas.projectId' app.json). Commit it to naomi-hub/app/app.json under expo.extra.eas.projectId to skip this step."
          fi

      - name: App Store Connect key
        if: steps.gate.outputs.ready == 'true'
        run: |
          if [ -n "$ASC_API_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ]; then
            KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
            bash ../scripts/ci-asc-key.sh "$KEY"
            {
              echo "EXPO_ASC_API_KEY_PATH=$KEY"
              echo "EXPO_ASC_KEY_ID=$ASC_KEY_ID"
              echo "EXPO_ASC_ISSUER_ID=$ASC_ISSUER_ID"
              [ -n "$APPLE_TEAM_ID" ] && echo "EXPO_APPLE_TEAM_ID=$APPLE_TEAM_ID"
              echo "EXPO_APPLE_TEAM_TYPE=${APPLE_TEAM_TYPE:-INDIVIDUAL}"
            } >> "$GITHUB_ENV"
            jq --arg p "$KEY" --arg k "$ASC_KEY_ID" --arg i "$ASC_ISSUER_ID" \
              '.submit.production.ios += {ascApiKeyPath: $p, ascApiKeyId: $k, ascApiKeyIssuerId: $i}' \
              eas.json > eas.tmp && mv eas.tmp eas.json
          else
            echo "::notice::No ASC_API_KEY_P8/ASC_KEY_ID/ASC_ISSUER_ID secrets; EAS will use credentials already stored on expo.dev."
          fi

      # The app reads these at build time (EXPO_PUBLIC_*), so they live in the
      # EAS "production" environment that the cloud build uses.
      - name: App config for the build
        if: steps.gate.outputs.ready == 'true'
        run: |
          if [ -n "$NAOMI_API_URL" ] && [ -n "$NAOMI_APP_SECRET" ]; then
            eas env:set production --name EXPO_PUBLIC_API_URL --value "$NAOMI_API_URL" --visibility plaintext --non-interactive
            eas env:set production --name EXPO_PUBLIC_APP_SECRET --value "$NAOMI_APP_SECRET" --visibility sensitive --non-interactive
          else
            echo "::warning::NAOMI_API_URL / NAOMI_APP_SECRET secrets are not set; photo checks will fall back to parent approval."
          fi

      # EAS will not attach a distribution certificate or create a provisioning
      # profile in non-interactive mode. Run its interactive setup in a pseudo-
      # terminal and press Enter at every prompt, which takes the defaults
      # (reuse the team's existing certificate, generate the profile with the
      # ASC key). Once credentials exist this only validates them.
      - name: Set up iOS signing
        if: steps.gate.outputs.ready == 'true'
        env:
          CI: 'false'
        run: |
          ( while sleep 3; do printf '\r' 2>/dev/null || exit 0; done ) | timeout 600 \
            script -qefc "eas credentials:configure-build --platform ios --profile production" /dev/null

      - name: Build (and submit to TestFlight)
        if: steps.gate.outputs.ready == 'true'
        run: |
          SUBMIT=""
          if [ -n "$ASC_APP_ID" ]; then
            jq --arg id "$ASC_APP_ID" '.submit.production.ios.ascAppId = $id' eas.json > eas.tmp && mv eas.tmp eas.json
            SUBMIT="--auto-submit"
          else
            echo "::warning::NAOMI_ASC_APP_ID secret is not set; building without TestFlight submission."
          fi
          eas build --platform ios --profile production --non-interactive --no-wait $SUBMIT
